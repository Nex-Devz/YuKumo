name: Bug Report
description: Report a bug to help us improve Yukumo
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out the
        fields below so we can reproduce and fix the issue quickly.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I searched existing issues and this has not been reported yet.
          required: true
        - label: I am using a supported Lavalink v4 (or NodeLink) server.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps (or a code snippet) that reproduce the behaviour.
      placeholder: |
        1. Create a player with '...'
        2. Call '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: yukumo-version
    attributes:
      label: Yukumo version
      placeholder: "1.8.0"
    validations:
      required: true
  - type: dropdown
    id: server-type
    attributes:
      label: Server type
      options:
        - Lavalink
        - NodeLink
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Lavalink / NodeLink version
      placeholder: "Lavalink 4.0.8 / NodeLink dev"
    validations:
      required: true
  - type: input
    id: plugins
    attributes:
      label: Server plugins
      description: Lavalink/NodeLink plugins in use (LavaSrc, SponsorBlock, youtube-source, etc.) and their versions.
      placeholder: "LavaSrc 4.2.0, SponsorBlock 3.0.1"
  - type: dropdown
    id: library
    attributes:
      label: Discord library
      options:
        - discord.js
        - Eris
        - Seyfert
        - Oceanic.js
        - Davey
        - Discordeno
        - Raw gateway adapter
        - Other
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime version
      placeholder: "Node.js 20.11.0 / Bun 1.1.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any error output or debug logs. This will be rendered as code, no need for backticks.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help.
