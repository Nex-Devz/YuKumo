name: Greetings

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    name: First Interaction Welcome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Thank you for opening your first issue in YuKumo! Please ensure reproduction steps and environment details (Node/Bun version, Lavalink/NodeLink server version) are included."
          pr-message: "Thank you for submitting your first pull request! Please verify that unit tests pass (`npm test`) and code formatting passes (`npm run format:check`). A maintainer will review your changes shortly."
