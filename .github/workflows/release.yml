name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify formatting and types
        run: |
          npm run format:check
          npm run typecheck
          npm run lint

      - name: Run test suite
        run: npm test

      - name: Build production package distribution
        run: npm run build

      - name: Verify version matches tag (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi
          echo "Version $PACKAGE_VERSION matches tag $TAG_VERSION."

      - name: Generate cryptographic SHA-256 checksums
        run: |
          mkdir -p release-assets
          cp -r dist/ release-assets/
          cd dist
          sha256sum * > ../release-assets/SHA256SUMS.txt
          cd ..
          cat release-assets/SHA256SUMS.txt

      - name: Package tarball
        run: npm pack --pack-destination release-assets/

      - name: Publish to npm registry
        if: env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/*
            release-assets/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
